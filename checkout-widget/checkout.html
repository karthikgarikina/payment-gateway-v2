<!DOCTYPE html>
<html>
  <body>
    <h3>Checkout Page (Iframe)</h3>

    <button id="success">Simulate Success</button>
    <button id="fail">Simulate Failure</button>

    <script>
      document.getElementById("success").onclick = () => {
        window.parent.postMessage(
          {
            type: "payment_success",
            data: { paymentId: "pay_test_123" }
          },
          "*"
        );
      };

      document.getElementById("fail").onclick = () => {
        window.parent.postMessage(
          {
            type: "payment_failed",
            data: { reason: "Payment failed" }
          },
          "*"
        );
      };
    </script>
  </body>
</html>
